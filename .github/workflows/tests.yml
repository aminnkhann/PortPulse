name: PortPulse CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portpulse
          POSTGRES_PASSWORD: portpulse_test
          POSTGRES_DB: portpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portpulse -d portpulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORTPULSE_TEST_DATABASE_URL: postgresql://portpulse:portpulse_test@localhost:5432/portpulse_test
      DBT_HOST: localhost
      DBT_PORT: "5432"
      DBT_USER: portpulse
      DBT_PASSWORD: portpulse_test
      DBT_DATABASE: portpulse_test
      DBT_SCHEMA: analytics
      AIRFLOW_HOME: ${{ runner.temp }}/portpulse-airflow
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Airflow with official constraints
        run: >-
          python -m pip install -r requirements-airflow.txt
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
      - name: Install project and dbt dependencies
        run: >-
          python -m pip install -r requirements-airflow.txt -r requirements.txt -r requirements-dbt.txt
      - run: ruff check .
      - name: Initialize Airflow and check DAG imports
        run: |
          airflow db migrate
          airflow dags list
          airflow dags list-import-errors
      - name: Apply database migrations
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          with psycopg.connect(os.environ["PORTPULSE_TEST_DATABASE_URL"]) as connection:
              for migration in sorted(Path("migrations").glob("*.sql")):
                  connection.execute(migration.read_text(), prepare=False)
          PY
      - name: Load deterministic dbt fixture rows
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg

          fixture = Path("dbt/fixtures/ci_seed.sql").read_text()
          with psycopg.connect(os.environ["PORTPULSE_TEST_DATABASE_URL"]) as connection:
              connection.execute(fixture, prepare=False)
          PY
      - run: python -m unittest discover -s tests -v
      - name: Configure dbt profile
        run: |
          mkdir -p "$HOME/.dbt"
          cp dbt/profiles.example.yml "$HOME/.dbt/profiles.yml"
      - name: Build dbt models and run data tests
        working-directory: dbt
        run: |
          dbt debug
          dbt build
