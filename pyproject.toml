[project]
name = "portpulse"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apache-airflow==3.4.0",
    "apache-airflow-providers-fab==3.10.2",
    "apache-airflow-providers-standard==1.21.0",
    "apache-airflow-providers-apache-kafka==3.0.0",
    "dbt-core==1.11.17",
    "dbt-postgres==1.11.0",
    "opentelemetry-exporter-otlp==1.45.2",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
