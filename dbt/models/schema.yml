
version: 2

models:
  - name: stg_portnet_eta
    columns:
      - name: observation_id
        data_tests:
          - unique
          - not_null

      - name: event_id
        data_tests:
          - not_null

      - name: eta_utc
        data_tests:
          - not_null

  - name: mart_portnet_latest_eta
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null

      - name: eta_utc
        data_tests:
          - not_null

  - name: stg_stream_eta_changes
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: kafka_topic
        data_tests:
          - not_null
      - name: kafka_partition
        data_tests:
          - not_null
      - name: kafka_offset
        data_tests:
          - not_null
      - name: cdc_operation
        data_tests:
          - not_null
      - name: scenario_id
        data_tests:
          - not_null
      - name: port_call_id
        data_tests:
          - not_null
      - name: port_area_code
        data_tests:
          - not_null
      - name: source_updated_at_utc
        data_tests:
          - not_null

  - name: mart_stream_latest_eta
    columns:
      - name: scenario_id
        data_tests:
          - not_null
      - name: port_call_id
        data_tests:
          - not_null
      - name: port_area_code
        data_tests:
          - not_null
      - name: cdc_operation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['c', 'u', 'r']
      - name: eta_utc
        data_tests:
          - not_null

  - name: stg_synthetic_eta
    columns:
      - name: synthetic_observation_id
        data_tests:
          - unique
          - not_null
      - name: event_id
        data_tests:
          - unique
          - not_null
      - name: port_call_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['coordinator_sim', 'carrier_sim', 'terminal_sim']
      - name: event_time_utc
        data_tests:
          - not_null
      - name: received_at_utc
        data_tests:
          - not_null
      - name: ingested_at_utc
        data_tests:
          - not_null
      - name: eta_utc
        data_tests:
          - not_null

  - name: mart_synthetic_eta_daily_activity
    columns:
      - name: event_date_utc
        data_tests:
          - unique
          - not_null
      - name: eta_updates
        data_tests:
          - not_null
      - name: port_calls_updated
        data_tests:
          - not_null

  - name: mart_synthetic_eta_revision_history
    columns:
      - name: synthetic_observation_id
        data_tests:
          - unique
          - not_null
      - name: event_id
        data_tests:
          - not_null
      - name: port_call_id
        data_tests:
          - not_null
      - name: event_time_utc
        data_tests:
          - not_null
      - name: received_at_utc
        data_tests:
          - not_null
      - name: ingested_at_utc
        data_tests:
          - not_null
      - name: eta_utc
        data_tests:
          - not_null

  - name: mart_synthetic_eta_latest_eta
    columns:
      - name: port_call_id
        data_tests:
          - unique
          - not_null
      - name: event_id
        data_tests:
          - not_null
      - name: source_id
        data_tests:
          - not_null
      - name: eta_utc
        data_tests:
          - not_null
      - name: event_time_utc
        data_tests:
          - not_null
      - name: received_at_utc
        data_tests:
          - not_null
      - name: ingested_at_utc
        data_tests:
          - not_null

  - name: mart_synthetic_eta_quality
    description: One-row cumulative synthetic ingestion quality snapshot; not a daily trend.
    columns:
      - name: accepted_observations
        data_tests:
          - not_null
      - name: rejected_events
        data_tests:
          - not_null
      - name: duplicate_issues
        data_tests:
          - not_null
      - name: collision_issues
        data_tests:
          - not_null
