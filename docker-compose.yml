services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_DB: portpulse
      POSTGRES_USER: portpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portpulse -d portpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  airflow:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: ["bash", "/opt/portpulse/docker/start-airflow.sh"]
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__DAGS_FOLDER: /opt/portpulse/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      DATABASE_URL: postgresql://portpulse:${POSTGRES_PASSWORD:-admin}@db:5432/portpulse
      DBT_HOST: db
      DBT_PORT: "5432"
      DBT_USER: portpulse
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      DBT_DATABASE: portpulse
      DBT_SCHEMA: analytics
      AIRFLOW_CONN_PORTPULSE_KAFKA: >-
        {"conn_type":"kafka","extra":{"bootstrap.servers":"kafka:9092","group.id":"portpulse-streaming-cdc","enable.auto.commit":false,"auto.offset.reset":"earliest"}}
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8080}:8080"
    volumes:
      - airflow_data:/opt/airflow
    restart: unless-stopped

  metabase:
    image: metabase/metabase:v0.65.4.x
    depends_on:
      db:
        condition: service_healthy
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    volumes:
      - metabase_data:/metabase-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  bi-setup:
    build: .
    depends_on:
      db:
        condition: service_healthy
      metabase:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: portpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: portpulse
      DBT_HOST: db
      DBT_PORT: "5432"
      DBT_USER: portpulse
      DBT_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      DBT_DATABASE: portpulse
      DBT_SCHEMA: analytics
      METABASE_URL: http://metabase:3000
      METABASE_DB_PASSWORD: ${METABASE_DB_PASSWORD:-portpulse-local-reader}
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@example.test}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-portpulse-local-demo-2026}
    command: ["bash", "-lc", "dbt build --project-dir /opt/portpulse/dbt && python scripts/setup_metabase.py"]
    restart: "no"

  kafka:
    image: apache/kafka:4.1.1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  kafka-connect:
    image: quay.io/debezium/connect:3.7.1.Final
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: portpulse_connect_configs
      OFFSET_STORAGE_TOPIC: portpulse_connect_offsets
      STATUS_STORAGE_TOPIC: portpulse_connect_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  cdc-topic-setup:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: >-
      /opt/kafka/bin/kafka-topics.sh
      --bootstrap-server kafka:9092
      --create --if-not-exists
      --topic portpulse_stream.stream_demo.port_eta_state
      --partitions 3
      --replication-factor 1
    restart: "no"

  cdc-setup:
    build: .
    depends_on:
      db:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      cdc-topic-setup:
        condition: service_completed_successfully
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
    command: ["python", "scripts/register_cdc_connector.py"]
    restart: "no"

  kafka-volume-init:
    image: busybox:1.37.0
    user: "0:0"
    volumes:
      - kafka_data:/data
    command: ["sh", "-c", "chown -R 1000:1000 /data"]

volumes:
  postgres_data:
  airflow_data:
  kafka_data:
  metabase_data:
