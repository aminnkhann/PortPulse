services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portpulse
      POSTGRES_USER: portpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portpulse_local_only}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portpulse -d portpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
