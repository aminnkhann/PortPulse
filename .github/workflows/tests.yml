name: PortPulse CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portpulse
          POSTGRES_PASSWORD: portpulse_test
          POSTGRES_DB: portpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portpulse -d portpulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PORTPULSE_TEST_DATABASE_URL: postgresql://portpulse:portpulse_test@localhost:5432/portpulse_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
